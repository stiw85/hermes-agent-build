[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-trader"
version = "0.1.0"
description = "Lean self-improving trading agent (crypto via ccxt, US stocks/crypto via Alpaca), distilled from Hermes Agent"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
  "numpy>=1.26",
  "pandas>=2.1",
  "pyyaml>=6.0",
  "requests>=2.31",
]

[project.optional-dependencies]
crypto = ["ccxt>=4.3"]
dev = ["pytest>=8", "ccxt>=4.3"]

[project.scripts]
hermes-trader = "hermes_trader.cli:main"

[tool.setuptools.packages.find]
include = ["hermes_trader*"]

[tool.setuptools.package-data]
hermes_trader = ["templates/*", "playbooks/*/SKILL.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py311"
